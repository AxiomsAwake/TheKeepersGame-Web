name: Publish playable Web release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate immutable release mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release mirror
        uses: actions/checkout@v6

      - name: Restore accepted compiled release
        run: python3 scripts/restore-release.py

      - name: Verify files, notices, and local HTTP delivery
        run: scripts/check.sh

      - name: Set up browser test runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/keepers-browser" --no-package-lock --no-save playwright@1.62.1 pngjs@7.0.0
          "$RUNNER_TEMP/keepers-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise the compiled 3D game in WebGL2
        run: |
          python3 -m http.server 4173 --directory site > /tmp/keepers-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/keepers-browser/node_modules" node scripts/browser-smoke.cjs

      - name: Retain compiled browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Keepers-Web-3D-evidence
          path: artifacts/
          if-no-files-found: warn

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy production page
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production delivery
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${PAGE_URL}" | grep -F 'The Keepers: Influence Arena'
          for asset in index.js index.pck index.wasm about.html; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --head "${PAGE_URL}${asset}"
          done
