name: Publish playable Web release

on:
  push:
    branches: [main]
    paths: ['.release-payload/**', 'CHECKSUMS.sha256']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the accepted compiled mirror after validation
        type: boolean
        default: false
      upload_evidence:
        description: Transfer bounded review PNG/JSON only when CI_REVIEW_UPLOADS_ENABLED is true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release mirror
        uses: actions/checkout@v6

      - name: Restore accepted compiled release
        run: python3 scripts/restore-release.py

      - name: Verify files, notices, and local HTTP delivery
        run: scripts/check.sh

      - name: Set up browser test runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pinned browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/keepers-browser" --no-package-lock --no-save playwright@1.62.1 pngjs@7.0.0
          "$RUNNER_TEMP/keepers-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise the compiled 3D game in WebGL2
        run: |
          python3 -m http.server 4173 --directory site > /tmp/keepers-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/keepers-browser/node_modules" node scripts/browser-smoke.cjs

      - name: Select a bounded explicit review transfer
        id: evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.upload_evidence == true && vars.CI_REVIEW_UPLOADS_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path('artifacts')
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in ('.png', '.json'))
          if any(p.is_symlink() or not p.resolve().is_relative_to(root.resolve()) for p in files):
              raise RuntimeError('Review input must be a regular owned file')
          if not 0 < len(files) <= 96 or sum(p.stat().st_size for p in files) > 16 * 1024 * 1024:
              print('Review transfer omitted: empty or above 16 MiB/96-file budget; test outcome is unchanged.')
          else:
              destination = pathlib.Path(os.environ['RUNNER_TEMP']) / ('keepers-mirror-review-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              destination.mkdir(exist_ok=False)
              for file in files:
                  target = destination / file.relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(file, target)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('directory=' + str(destination) + '\nready=true\n')
          PY
      - name: Transfer optional review evidence once
        if: always() && steps.evidence.outcome == 'success' && steps.evidence.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Keepers-Web-3D-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}/
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || inputs.deploy == true
        uses: actions/configure-pages@v5

      - name: Upload exact static site
        if: github.event_name == 'push' || inputs.deploy == true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Deploy production page
    needs: validate
    if: github.event_name == 'push' || inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production delivery
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${PAGE_URL}" | grep -F 'The Keepers: Influence Arena'
          for asset in index.js index.pck index.wasm about.html; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --head "${PAGE_URL}${asset}"
          done
